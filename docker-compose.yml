services:
  postgres:
    image: postgres:16
    container_name: turitec-postgres
    environment:
      POSTGRES_USER: turitec
      POSTGRES_PASSWORD: turitec123
      POSTGRES_DB: turitec
    ports:
      - "5432:5432"
    volumes:
      - turitec_pgdata:/var/lib/postgresql/data
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turitec -d turitec"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: turitec-app
    environment:
      DATABASE_URL: postgresql://turitec:turitec123@postgres:5432/turitec
      SECRET_KEY: turitec-dev-secret-cambiar-en-produccion
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  turitec_pgdata:
